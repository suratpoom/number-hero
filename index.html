<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>เจ้าคุณผจญภัย</title>
<meta name="description" content="เกมฝึกบวก ลบ คูณ หาร และเขียนเลข สำหรับเด็ก">
<meta name="theme-color" content="#2a2767">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="เจ้าคุณ">
<script>/* เปิดจากในไลน์: ให้เด้งไปเบราว์เซอร์จริง เพราะในไลน์ติดตั้งและเก็บความคืบหน้าไม่ได้ดี */
if(/Line\//i.test(navigator.userAgent)&&!/openExternalBrowser=1/.test(location.search))location.replace(location.pathname+'?openExternalBrowser=1');</script>
<style>
:root{--ink:#3b2a4a;--cream:#fff8ec;--gold:#ffc83d;--orange:#ff8a3d;--star:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:"Leelawadee UI","Sukhumvit Set","Noto Sans Thai","Thonburi",system-ui,sans-serif;overflow:hidden;background:#2a2767;color:var(--ink);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#262460 0%,#5b3fa0 30%,#c85f9a 56%,#ff9a6b 76%,#ffd08a 100%)}

/* ---------- ฉากหลัง ---------- */
.sun{position:absolute;left:50%;top:60%;width:42vmin;height:42vmin;margin-left:-21vmin;border-radius:50%;background:radial-gradient(circle,#fff6c9 0,#ffd97a 45%,rgba(255,200,100,0) 70%);animation:glow 5s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.08);opacity:.85}}
.tw{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.5)}}
.cloud{position:absolute;height:34px;width:120px;border-radius:40px;background:rgba(255,255,255,.22);animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:54px;height:54px;left:18px;top:-24px}
.cloud::after{width:40px;height:40px;left:62px;top:-14px}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(110vw)}}
.hills{position:absolute;left:0;bottom:0;width:100%;height:36vh}
.fly{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff4a8;box-shadow:0 0 12px 4px rgba(255,240,140,.7);animation:ff 7s ease-in-out infinite}
@keyframes ff{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(26px,-34px);opacity:1}}

/* ---------- โครงหน้า ---------- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:max(14px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));gap:12px}
.screen.on{display:flex;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:scale(.97)}}
.wrap{width:100%;max-width:760px}
.top{display:flex;align-items:center;gap:10px}
.ic{width:52px;height:52px;flex:none;border:0;border-radius:18px;background:rgba(255,255,255,.2);backdrop-filter:blur(8px);display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}
.ic svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ic.off{opacity:.45}
.ic:active{transform:scale(.92)}
.starc{margin-left:auto;display:flex;align-items:center;gap:6px;height:52px;padding:0 16px 0 12px;border-radius:26px;background:rgba(30,20,70,.45);color:#fff;font-weight:900;font-size:22px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.22)}
.st{display:inline-block;width:28px;height:28px;background:linear-gradient(#ffe37a,#ffb41f);clip-path:var(--star)}

/* ---------- หน้าแรก ---------- */
.title{margin:2px 0 0;text-align:center;color:#fff;font-size:clamp(34px,9vw,60px);font-weight:900;line-height:1.1;text-shadow:0 4px 0 #6b3fa6,0 10px 24px rgba(0,0,0,.35);letter-spacing:.5px}
.sub{color:#ffe9b8;font-weight:700;font-size:clamp(14px,3.6vw,18px);text-align:center;margin-top:4px}
.hero{flex:1 1 0;min-height:110px;position:relative;width:100%;pointer-events:none}
.hero .fox{position:absolute;top:0;bottom:0;left:50%;height:100%;max-height:300px;margin:auto 0;aspect-ratio:1;transform:translateX(-50%);filter:drop-shadow(0 16px 14px rgba(20,10,60,.4))}
.hero .fox>svg{animation:bob 2.6s ease-in-out infinite}
#home{overflow-y:auto}
@keyframes bob{50%{transform:translateY(-10px)}}
.fox .eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.fox .tail,.mfox .tail,.fb .tail{transform-box:fill-box;transform-origin:60% 0;animation:wag 1.2s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(-14deg)}}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mode{border:0;border-radius:26px;background:var(--cream);padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left;box-shadow:0 6px 0 #d9c2a0,0 16px 26px rgba(20,10,60,.3);transition:transform .08s,box-shadow .08s}
.mode:active{transform:translateY(5px);box-shadow:0 1px 0 #d9c2a0,0 6px 10px rgba(20,10,60,.3)}
.mode:last-child{grid-column:1/-1}
.mi{width:56px;height:56px;flex:none;border-radius:18px;background:var(--c);display:grid;place-items:center;color:#fff;font-size:38px;font-weight:900;line-height:1;box-shadow:inset 0 -5px 0 rgba(0,0,0,.16)}
.mi svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.mode b{display:block;font-size:22px;font-weight:900}
.mode small{display:block;font-size:13px;opacity:.65;font-weight:700;line-height:1.25}
.modes{grid-template-columns:repeat(var(--n,5),minmax(0,1fr))!important;gap:8px}
.modes .mode{flex-direction:column;text-align:center;padding:10px 2px 8px;gap:5px;border-radius:20px;grid-column:auto}
.modes .mi{width:44px;height:44px;font-size:30px;border-radius:14px}
.modes .mi svg{width:24px;height:24px}
.modes .mode b{font-size:14px}
.modes .mode small{display:none}
.advbtn{background:linear-gradient(#ffe37a,#ffc21a);box-shadow:0 6px 0 #c98f0a,0 16px 26px rgba(20,10,60,.3)}
.advbtn:active{box-shadow:0 1px 0 #c98f0a}
.advbtn small{opacity:.8}
.medc{margin-left:auto;display:flex;align-items:center;gap:5px;font-weight:900;font-size:20px;color:#fff;background:rgba(40,26,90,.85);padding:6px 14px 6px 9px;border-radius:20px}
/* ---------- แผนที่ผจญภัย ---------- */
.maph{color:#fff;font-weight:900;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.map{flex:1;min-height:0;overflow-y:auto;width:100%;max-width:520px;scrollbar-width:none;touch-action:pan-y;cursor:grab;-webkit-mask-image:linear-gradient(transparent,#000 34px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(transparent,#000 34px,#000 calc(100% - 24px),transparent)}
.map::-webkit-scrollbar{display:none}
.map.drag{cursor:grabbing}
.mapin{margin-top:26px}
.mapin{position:relative;width:100%}
.mapin>svg{position:absolute;inset:0;width:100%;height:100%}
.mn{position:absolute;transform:translate(-50%,-50%);width:130px;border:0;background:none;display:flex;flex-direction:column;align-items:center;padding:0}
.mnc{width:76px;height:76px;border-radius:50%;background:var(--c);border:5px solid #fff;display:grid;place-items:center;color:#fff;font-size:40px;font-weight:900;line-height:1;box-shadow:0 7px 0 rgba(20,10,60,.35),0 14px 20px rgba(20,10,60,.35)}
.mnc svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.mn em{font-style:normal;color:#fff;font-weight:800;font-size:14px;margin-top:9px;white-space:nowrap;text-shadow:0 2px 4px rgba(20,10,60,.8)}
.mst{display:flex;height:14px;margin-top:2px}.mst .st{width:14px;height:14px}.mst .st.off{background:rgba(255,255,255,.3)}
.mn.lock .mnc{background:#7c74a8;border-color:rgba(255,255,255,.5)}
.mn.cur .mnc{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.1);box-shadow:0 7px 0 rgba(20,10,60,.35),0 0 0 12px rgba(255,255,255,.22)}}
.mn:active .mnc{transform:translateY(5px)}
.mfox{position:absolute;top:-50px;left:50%;width:58px;height:58px;margin-left:-29px;animation:bob 1.4s ease-in-out infinite;pointer-events:none}
.mn.chest .mnc{width:96px;height:96px;border-radius:26px;background:linear-gradient(#ffe37a,#ffb41f);padding:8px}
.mn.chest.lock .mnc{filter:grayscale(.8);opacity:.75}
.mn.chest .mnc svg{width:100%;height:100%;stroke:none}
.plus{color:#ffe37a;font-weight:900;font-size:22px;line-height:1.35;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.fl{position:fixed;z-index:60;color:#fff;font-weight:900;font-size:34px;text-shadow:0 3px 0 #2f9d68;pointer-events:none;animation:flup 1s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes flup{to{transform:translate(-50%,-190%);opacity:0}}
.chestbig{position:relative;width:min(62vw,260px)}
.chestbig svg{display:block;width:100%;height:auto;overflow:visible}
.lid{transform-origin:30px 90px;transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.open .lid{transform:rotate(-36deg)}
.medal{position:absolute;left:50%;top:48%;width:96px;height:96px;margin:-48px;background:linear-gradient(#fff6b8,#ffb41f);clip-path:var(--star);transform:scale(0);transition:transform .9s .35s cubic-bezier(.3,1.6,.5,1)}
.open .medal{transform:translateY(-125px) scale(1.35) rotate(360deg)}
.lv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:6px;border-radius:26px;background:rgba(30,20,70,.5);box-shadow:inset 0 0 0 2px rgba(255,255,255,.22)}
.lv button{border:0;border-radius:20px;height:48px;background:transparent;color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.lv button .st{width:16px;height:16px;margin-left:-3px}
.lv button .st:first-of-type{margin-left:2px}
.lv button.on{background:var(--cream);color:var(--ink);box-shadow:0 4px 0 #d9c2a0}
.ver{color:rgba(255,255,255,.6);font-size:12px;font-weight:700}


/* ---------- ทางเดิน ---------- */
.track{flex:1;height:52px;position:relative;margin:0 4px}
.tin{position:absolute;left:24px;right:24px;top:0;bottom:0}
.tin::before{content:"";position:absolute;left:0;right:0;top:34px;height:8px;border-radius:4px;background:rgba(255,255,255,.28)}
.bar{position:absolute;left:0;top:34px;height:8px;border-radius:4px;background:var(--gold);transition:width .6s cubic-bezier(.4,1.4,.5,1)}
.nd{position:absolute;top:28px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#fff;opacity:.55;transition:.3s}
.nd.done{background:var(--gold);opacity:1}
.nd.goal{top:20px;width:36px;height:36px;margin-left:-18px;border-radius:0;background:linear-gradient(#ffe37a,#ffb41f);clip-path:var(--star);opacity:1;animation:glow 1.6s infinite}
.walker{position:absolute;top:-8px;width:50px;height:50px;margin-left:-25px;transition:left .6s cubic-bezier(.4,1.4,.5,1);z-index:2}
.walker.hop svg{animation:hop .6s ease}
@keyframes hop{40%{transform:translateY(-16px) rotate(-8deg)}}

/* ---------- การ์ดคำถาม ---------- */
.card{flex:1;min-height:0;background:var(--cream);border-radius:34px;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 0 #e3cba6,0 22px 40px rgba(20,10,60,.35);overflow:hidden}
.card.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.cap{font-size:clamp(16px,4.2vw,22px);font-weight:800;text-align:center;color:#7a5a3a}
.visual{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;max-width:100%}
.grp{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;padding:10px 8px 6px;border-radius:22px;background:#fff;border:3px dashed #efd6ae;max-width:calc(var(--s)*5 + 52px)}
.grp.wide{max-width:100%}
.op{font-size:36px;font-weight:900;color:var(--orange)}
.ap{width:var(--s);height:var(--s);margin:4px 3px 2px;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 32% 28%,#ffa293,#e8384f 55%,#b81f3a);position:relative;display:inline-grid;place-items:center;animation:pop .4s backwards cubic-bezier(.3,1.6,.5,1);box-shadow:inset -3px -4px 0 rgba(0,0,0,.12)}
.ap::before{content:"";position:absolute;top:-16%;left:52%;width:36%;height:22%;background:#4cae4f;border-radius:0 80% 0 80%}
.ap::after{content:"";position:absolute;top:-14%;left:45%;width:9%;height:18%;background:#6b4226;border-radius:2px}
.ap.b{background:radial-gradient(circle at 32% 28%,#ffe98a,#f8ae2c 55%,#d9811a)}
.ap.gone{animation:pop .4s backwards,eat .5s .9s forwards}
@keyframes pop{from{transform:scale(0)}}
@keyframes eat{to{opacity:.22;filter:grayscale(1);transform:scale(.78) rotate(18deg)}}
.ap b{color:#fff;font-weight:900;font-size:calc(var(--s)*.52);opacity:0;transform:scale(.3);transition:.2s;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.ap.num b{opacity:1;transform:none}
.eq{font-size:min(9vh,11.5vw,80px);white-space:nowrap;font-weight:900;display:flex;align-items:center;gap:.22em;line-height:1.1}
.eq i{font-style:normal;color:var(--orange)}
.qm{display:inline-grid;place-items:center;min-width:1.25em;height:1.25em;border-radius:.28em;background:#ffe9c4;border:4px dashed var(--orange);color:var(--orange);animation:bob 1.2s ease-in-out infinite}
.qm.ans{background:#4cc38a;border:4px solid #2f9d68;color:#fff;animation:pop .4s cubic-bezier(.3,1.8,.5,1)}

/* ---------- ปุ่มคำตอบ ---------- */
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ch{border:0;border-radius:28px;height:clamp(76px,15vh,124px);font-size:clamp(38px,8vh,64px);font-weight:900;color:#fff;background:var(--c);box-shadow:0 7px 0 var(--d),0 16px 24px rgba(10,5,40,.4);transition:transform .08s,box-shadow .08s}
.ch:active{transform:translateY(6px);box-shadow:0 1px 0 var(--d)}
.ch.no{opacity:.35;transform:translateY(6px);box-shadow:0 1px 0 var(--d);pointer-events:none}
.ch.ok{animation:yes .5s}
@keyframes yes{40%{transform:scale(1.12) rotate(-3deg)}}
.sp{position:fixed;width:24px;height:24px;margin:-12px;background:var(--gold);clip-path:var(--star);animation:flyout .8s ease-out forwards;pointer-events:none;z-index:50}
@keyframes flyout{to{transform:translate(var(--dx),var(--dy)) rotate(220deg) scale(.3);opacity:0}}

/* ---------- เขียนเลข ---------- */
.wwrap{position:relative;height:100%;max-height:100%;aspect-ratio:1;max-width:100%;border-radius:26px;background:#fff;border:3px dashed #efd6ae;touch-action:none;flex:1;min-height:0}
.wwrap canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:24px;touch-action:none}
.wbtns{display:grid;grid-template-columns:1fr 2fr;gap:12px}
.wbtns .ch{font-size:clamp(22px,5vw,30px);height:clamp(64px,11vh,90px)}

/* ---------- ชนะ ---------- */
/* ---------- ต่อสู้ ---------- */
.mhp{flex:1;min-width:0;color:#fff;font-weight:900;font-size:15px;text-shadow:0 2px 3px rgba(20,10,60,.7)}
.mhp b{display:block;white-space:nowrap;margin-bottom:3px}
.hpb{height:16px;border-radius:8px;background:rgba(30,20,70,.6);overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}
.hpb i{display:block;height:100%;width:100%;background:linear-gradient(#ff9a9a,#e8384f);border-radius:8px;transition:width .2s}
.hearts{display:flex;gap:1px}.hearts svg{width:26px;height:26px;fill:#ff4d6d;filter:drop-shadow(0 2px 2px rgba(20,10,60,.5))}.hearts svg.off{fill:rgba(255,255,255,.28)}
.arena{flex:1;min-height:0;position:relative;width:100%;max-width:760px;border-radius:34px;overflow:hidden;background:linear-gradient(rgba(30,20,70,.4),rgba(30,20,70,.08));box-shadow:inset 0 0 0 3px rgba(255,255,255,.22);touch-action:none}
.ground{position:absolute;left:0;right:0;bottom:0;height:20%;background:linear-gradient(#3f2f7a,#231b52);border-top:5px solid #7a63c9}
.tip{position:absolute;top:12px;left:0;right:0;padding:0 14px;text-align:center;color:#fff;font-weight:800;font-size:14px;text-shadow:0 2px 3px rgba(20,10,60,.8)}
.fb{position:absolute;left:-30%;bottom:20%;width:min(30%,140px);aspect-ratio:1;transform-origin:50% 100%}
.fb.punch>svg{animation:lunge .2s}
@keyframes lunge{50%{transform:translateX(22%)}}
.floor3{position:absolute;inset:0;width:100%;height:100%}
.ring{position:absolute;border-radius:50%;border:4px solid #ff4d6d;background:rgba(255,77,109,.32);pointer-events:none;z-index:1}
.fpad{display:flex;align-items:center;justify-content:space-between;gap:12px}
.joy{width:clamp(112px,33vw,150px);aspect-ratio:1;border-radius:50%;background:rgba(30,20,70,.6);box-shadow:inset 0 0 0 3px rgba(255,255,255,.32);display:grid;place-items:center;touch-action:none;flex:none}
.joy i{width:46%;height:46%;border-radius:50%;background:linear-gradient(#fff,#d9d2f5);box-shadow:0 5px 0 #8f7bd6;pointer-events:none}
.pbtn{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;max-width:320px}
.pbtn .ch{height:clamp(56px,9vh,78px);font-size:clamp(17px,4.6vw,24px);border-radius:22px;touch-action:none}
.sum{width:100%;max-width:460px;background:var(--cream);border-radius:22px;padding:10px 14px;text-align:left;font-weight:800;font-size:15px;box-shadow:0 5px 0 #e3cba6}
.sum b{display:block;font-size:17px;font-weight:900;margin-bottom:4px}
.sum div{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;padding:3px 0;border-top:2px dashed #efd6ae;color:#2f9d68}
.sum div.bad{color:#c94568}
#weapon,#win{overflow-y:auto}
#weapon>:first-child,#win>:first-child{margin-top:auto}
#weapon>:last-child,#win>:last-child{margin-bottom:auto}
.fb.hurt{animation:blinkh .16s 6}
@keyframes blinkh{50%{opacity:.2}}
.hand{position:absolute;right:-26%;top:26%;width:56%;aspect-ratio:1}
.hand svg,.pshot svg,.ws svg,.wpbig svg{display:block;width:100%;height:100%}
.fb.swing .hand{animation:swing .25s}
@keyframes swing{50%{transform:rotate(75deg) translate(18%,10%)}}
.fm{position:absolute;left:-60%;bottom:19%;width:min(40%,210px);aspect-ratio:1;transform-origin:50% 100%}
.fm>div{width:100%;height:100%;animation:bob 1.6s ease-in-out infinite}
.fm.hit{filter:brightness(1.9) saturate(.3)}
.fm.dead>div{animation:none;transition:transform .9s,opacity .9s;opacity:0;transform:rotate(50deg) scale(.3)}
.shot{position:absolute;border-radius:50%;pointer-events:none}
.shot.lo{background:radial-gradient(circle at 35% 35%,#fff3a8,#ff9a2e 50%,#e8384f);box-shadow:0 0 18px 6px rgba(255,140,40,.65)}
.shot.hi{background:radial-gradient(circle at 35% 35%,#f6dcff,#a56bff 50%,#5b2fb0);box-shadow:0 0 18px 6px rgba(165,107,255,.65)}
.pshot{position:absolute;pointer-events:none}
.pshot.spin{animation:spin .35s linear infinite}
.pshot.big{filter:drop-shadow(0 0 14px #ffe37a) drop-shadow(0 0 6px #fff)}
.arena.shake{animation:shake .3s}
.fbtn{grid-template-columns:1fr .8fr 1fr!important}
.fbtn.auto{grid-template-columns:1.3fr 1fr!important}
.fbtn.auto #batk{display:none}
/* แถบบนฉากสู้: กล่องฟ้า = เรา (หัวใจ) · กล่องแดง = สัตว์ประหลาด (แถบเลือด) */
.hud{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:18px;min-width:0;color:#fff;font-weight:900;font-size:13px;line-height:1.25;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}
.hud.me{background:rgba(42,116,201,.85);flex:none}

.tg{display:flex;flex-wrap:wrap;gap:8px}

.fxu{animation:fxup 2.4s linear infinite}

.fxg{transform-box:fill-box;transform-origin:center;animation:fxgl 1.8s ease-in-out infinite}

.fxr{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
.cc small{font-size:11px;line-height:1.2;color:#7a5a3a;font-weight:700}

.ic{position:relative}

.fbtn.sponly{grid-template-columns:1fr!important}

 +(G.who?`<h3>รหัส 4 หลักของ ${esc(G.who)}</h3><div class="note">${G.pin?'ตั้งรหัสไว้แล้ว คนอื่นต้องใส่รหัสก่อนถึงจะเล่นชื่อนี้ได้':'ยังไม่มีรหัส ใครก็เลือกชื่อนี้เล่นได้'}</div><div class="nm" style="margin-top:8px"><input id="npin" inputmode="numeric" maxlength="4" placeholder="เลข 4 หลัก (ว่าง = ไม่ใช้รหัส)"><button data-setpin="1">${G.pin?'เปลี่ยนรหัส':'ตั้งรหัส'}</button></div>`:'')}
async function savePin(){const v=$('npin').value.trim();if(v&&!cleanPin(v)){toast('<span>รหัสต้องเป็นเลข 4 หลัก</span>');return}
 let r=null;try{r=await cloud('setpin',{newPin:v})}catch(e){}
 if(r&&r.error==='not_found'){flush();toast('<span>กำลังบันทึกชื่อนี้ขึ้นชีต ลองกดอีกครั้ง</span>');return}
 if(!r||!r.ok){toast('<span>ตั้งรหัสไม่สำเร็จ ลองใหม่อีกครั้ง</span>');return}
 setPin(v);toast(`<span>${v?'ตั้งรหัสแล้ว จำไว้ให้ดีนะ':'เลิกใช้รหัสแล้ว'}</span>`);openParent()}
async function openWho(){flush();sheet('เลือกผู้เล่น','<div class="note">กำลังโหลดรายชื่อ</div>');let list=null;try{const r=await cloud('list');if(r.ok)list=r.players}catch(e){}
 const cur=G.who?`<div class="note">กำลังเล่นเป็น ${esc(G.who)}</div>`:'';
 const rows=list?(list.length?`<h3>เลือกชื่อที่เคยเล่น</h3><div class="wl">${list.map(p=>`<button data-who="${esc(p.name)}"><b>${esc(p.name)}</b><small>${esc(p.points)} แต้ม ด่านที่ ${esc(p.stage)}${p.hasPin?' มีรหัส':''}</small></button>`).join('')}</div>`:'<div class="note">ยังไม่มีผู้เล่น พิมพ์ชื่อเพื่อเริ่มเป็นคนแรก</div>')
  :'<div class="note">ต่อชีตไม่ได้ตอนนี้ ปิดหน้านี้แล้วเล่นต่อได้ ความคืบหน้าจะเก็บในเครื่องก่อน</div>';
 sheet('เลือกผู้เล่น',cur+rows+`<h3>หรือพิมพ์ชื่อใหม่</h3><div class="nm"><input id="wname" maxlength="12" placeholder="พิมพ์ชื่อเล่น"><button data-new="1">เริ่มเล่น</button></div><div class="nm" style="margin-top:8px"><input id="wnewpin" inputmode="numeric" maxlength="4" placeholder="ตั้งรหัส 4 หลัก (ไม่ใส่ก็ได้)"></div><div class="note">ความคืบหน้าบันทึกตามชื่อ ชื่อที่ไม่มีรหัส ใครพิมพ์ชื่อเดียวกันก็เล่นต่อได้</div>`)}
function askPin(n){sheet('ใส่รหัสของ '+n,`<div class="note">ชื่อนี้ตั้งรหัสไว้ ใส่เลข 4 หลักเพื่อเล่นต่อ</div><div class="nm" style="margin-top:8px"><input id="wpin" inputmode="numeric" maxlength="4" placeholder="เลข 4 หลัก"><button data-pinfor="${esc(n)}">เข้าเล่น</button></div><div class="nm" style="margin-top:8px"><button data-g="who" style="padding:10px 18px;background:#8f7bd6">กลับไปเลือกชื่อ</button></div>`)}
/* เลือกชื่อ: มีในชีต -> โหลดมาเล่นต่อ · ชื่อใหม่ -> เริ่มจากศูนย์ (ยกเว้นเครื่องที่เล่นมาก่อนมีระบบชื่อ จะยกความคืบหน้าเดิมให้ชื่อแรก) */
async function pickWho(raw,pin,newPin){const n=cleanName(raw);if(!n){toast('<span>พิมพ์ชื่อก่อนนะ</span>');return}
 if(newPin&&!cleanPin(newPin)){toast('<span>รหัสต้องเป็นเลข 4 หลัก</span>');return}
 if(G.who&&G.who.toLowerCase()===n.toLowerCase()){$('sheet').hidden=true;return}
 const tryPin=cleanPin(pin);let r=null;try{r=await cloud('load',{name:n,pin:tryPin})}catch(e){}
 if(r&&r.error==='bad_pin'){if(pin!==undefined)toast('<span>รหัสไม่ถูก ลองใหม่อีกครั้ง</span>');askPin(n);return}
 if(!r||!r.ok){toast('<span>ต่อชีตไม่ได้ ลองใหม่อีกครั้ง</span>');return}
 clearTimeout(G.timer);const hadWho=!!G.who;
 if(r.found){setPin(r.hasPin?tryPin:'');applySnap(r.data);G.saved=r.updated;setWho(r.name||n);G.synced=true;toast(`<span>เล่นต่อเป็น ${esc(G.who)}</span>`)}
 else{const keep=!hadWho&&(S.total||A.adv||A.medals||Object.keys(P.stat).length);
  if(!keep)applySnap({total:0,A:{},P:{},lv:'a',t:Date.now()});
  setPin(cleanPin(newPin));setWho(n);G.synced=true;setLt(Date.now());flush();toast(`<span>เริ่มเล่นเป็น ${esc(n)}</span>`)}
 $('sheet').hidden=true;show('home')}
/* เปิดเกม: ยังไม่เลือกชื่อ -> เปิดหน้าเลือก · เลือกแล้ว -> เทียบกับชีต ถ้าชีตใหม่กว่า (เล่นจากเครื่องอื่น) ใช้ของชีต */
async function cloudBoot(){drawWho();if(!cloudOn())return;if(!G.who){setTimeout(openWho,700);return}
 try{const r=await cloud('load');if(r.error==='bad_pin'){G.who='';setPin('');try{localStorage.removeItem('fnf_who')}catch(e){}drawWho();openWho();return}
  if(r.ok){const ct=r.found?(r.data.t||0):0;if(r.found&&ct>G.lt){applySnap(r.data);G.saved=r.updated}G.synced=true;if(ct<G.lt)flush()}}
 catch(e){G.synced=true}}
$('glog').onclick=()=>{sfx.tap();openWho()};
/* ============ พลังมือ: ตอบด้วยมือผ่านกล้อง ============
   ยกตัวจับมือมาจากเกม "คิดเลขจับมือ" v1.10 (D:\Calude\Jaokun-game) ค่าปรับจูนชุดเดียวกัน ห้ามลด confidence ลงอีก (เคยจับปาก/หน้าเป็นมือ)
   ในเกมนี้: มือเป็นลูกแก้วทอง ชี้ปุ่มคำตอบค้างไว้จนแถบทองเต็ม = กดปุ่มนั้น ใช้กับปุ่มคำตอบและปุ่มไปต่อ ส่วนฉากสู้ยังใช้นิ้วกด
   กล้องเปิดเฉพาะตอนอยู่ในด่าน กลับหน้าแรกหรือแผนที่แล้วปิดเอง · ตัวจับมือ (MediaPipe) โหลดจากเน็ตตอนเปิดใช้ครั้งแรกเท่านั้น */
const MP_V='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14',MP_MODEL='https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
const HCFG={DWELL:[900,1400,2000],IN_PAD:14,KEEP_PAD:44,ARM_MOVE:60,FRESH:400,STREAK:2,SMOOTH:.9,GRACE:700};
const H={want:false,on:false,busy:false,speed:1,stream:null,lm:null,ptr:null,ptrAt:0,last:0,gap:0,streak:0,lastNorm:null,vt:-1,t:0,raf:0,sig:'',grace:0,armFrom:null,armed:new WeakSet(),dwell:new Map()};
try{H.want=localStorage.getItem('fnf_hand')==='1';const v=localStorage.getItem('fnf_hsp');if(v!==null)H.speed=clamp(+v||0,0,2)}catch(e){}
function handOK(lm){if(!lm||lm.length<21)return false;const d=(a,b)=>Math.hypot(lm[a].x-lm[b].x,lm[a].y-lm[b].y),pw=d(5,17),pl=d(0,9);
 if(pw<1e-4||pl<1e-4)return false;const ra=pl/pw;if(ra<.55||ra>2.8)return false;const mid=d(9,12);
 if(mid<pl*.15||mid>pl*2.4)return false;return Math.max(pl,mid)>=.04}
function hApply(lm,now){const v=$('cam'),CW=innerWidth,CH=innerHeight,vw=v.videoWidth||4,vh=v.videoHeight||3,sc=Math.max(CW/vw,CH/vh),w=vw*sc,h=vh*sc,bx=(CW-w)/2,by=(CH-h)/2;
 const px=l=>CW-(bx+l.x*w),py=l=>by+l.y*h;let cx=0,cy=0;[8,12,16,20].forEach(i=>{cx+=px(lm[i]);cy+=py(lm[i])});cx/=4;cy/=4;
 const nx=px(lm[8])*.8+cx*.2,ny=py(lm[8])*.8+cy*.2,prev=H.ptr,gap=now-(H.ptrAt||now);H.gap=H.gap?H.gap*.8+gap*.2:gap;
 const re=!prev||gap>clamp(H.gap*3.5,180,700)||Math.hypot(nx-prev.x,ny-prev.y)>Math.min(CW,CH)*.55;
 H.ptr=re?{x:nx,y:ny}:{x:prev.x+(nx-prev.x)*HCFG.SMOOTH,y:prev.y+(ny-prev.y)*HCFG.SMOOTH};H.ptrAt=now;H.last=now}
function hTake(list,now){let best=null,bs=-1;for(const lm of list||[]){if(!handOK(lm))continue;const cx=(lm[0].x+lm[9].x)/2,cy=(lm[0].y+lm[9].y)/2;let sc=1;
  if(H.lastNorm)sc+=1.6/(1+Math.hypot(cx-H.lastNorm.x,cy-H.lastNorm.y)*5);if(lm[8].y<lm[0].y)sc+=.3;if(sc>bs){bs=sc;best={lm,cx,cy}}}
 if(!best){H.streak=0;if(now-H.last>900){H.ptr=null;H.lastNorm=null}return}
 H.streak++;H.lastNorm={x:best.cx,y:best.cy};if(H.streak<HCFG.STREAK&&!H.ptr)return;hApply(best.lm,now)}
/* ปุ่มที่มือกดได้ ณ ตอนนี้ */
function hTargets(){const scr=document.querySelector('.screen.on');if(!scr||!$('sheet').hidden)return[];
 if(scr.id==='fight')return F&&F.paused&&!F.qlock?[...$('qch').querySelectorAll('.ch:not(.no)')]:[];
 if(scr.id==='play')return S.lock?[]:S.cur==='write'?[$('wcheck')]:[...$('choices').querySelectorAll('.ch:not(.no)')];
 return['win','weapon','lose','reward'].includes(scr.id)?[...scr.querySelectorAll('.wact .ch')]:[]}
function hClear(){H.dwell=new Map();document.querySelectorAll('.hdw').forEach(e=>{e.classList.remove('hdw');e.style.removeProperty('--dw')})}
function hStep(now,dt){const cur=$('hcur');if(!H.ptr){cur.hidden=true;return}cur.hidden=false;cur.style.transform=`translate(${H.ptr.x}px,${H.ptr.y}px)`;
 const ts=hTargets(),sig=((document.querySelector('.screen.on')||{}).id||'')+'|'+S.i+'|'+ts.map(t=>t.textContent).join(',');
 /* ปุ่มชุดใหม่ (ข้อใหม่/หน้าใหม่): พัก 0.7 วิ และต้องขยับมือก่อน มือที่ค้างจากข้อก่อนจะไม่กลายเป็นคำตอบข้อใหม่ */
 if(sig!==H.sig){H.sig=sig;H.grace=now+HCFG.GRACE;H.armFrom=null;H.armed=new WeakSet();hClear()}
 if(now<H.grace||!ts.length)return;
 if(!H.armFrom)H.armFrom={x:H.ptr.x,y:H.ptr.y};const moved=Math.hypot(H.ptr.x-H.armFrom.x,H.ptr.y-H.armFrom.y)>HCFG.ARM_MOVE;
 const need=HCFG.DWELL[H.speed],fresh=now-H.last<Math.max(HCFG.FRESH,Math.min(1200,H.gap*3.5));
 const inR=(r,p)=>H.ptr.x>r.left-p&&H.ptr.x<r.right+p&&H.ptr.y>r.top-p&&H.ptr.y<r.bottom+p;
 let hit=null,hd=1e9;const rs=new Map();
 for(const b of ts){const r=b.getBoundingClientRect();rs.set(b,r);if(!H.armed.has(b)){if(moved||!inR(r,26))H.armed.add(b);else continue}
  if(inR(r,(H.dwell.get(b)||0)>0?HCFG.KEEP_PAD:HCFG.IN_PAD)){const d=Math.hypot(H.ptr.x-(r.left+r.width/2),H.ptr.y-(r.top+r.height/2));if(d<hd){hd=d;hit=b}}}
 for(const b of ts){let d=H.dwell.get(b)||0;
  if(b===hit){if(fresh){if(!d)tone(620,0,.06,'square',.05);d+=dt}}else d=Math.max(0,d-dt*.9);
  H.dwell.set(b,d);b.classList.toggle('hdw',d>0);b.style.setProperty('--dw',Math.min(1,d/need));
  if(d>=need){hClear();H.sig='';b.click();return}}}
function hLoop(){if(!H.on)return;H.raf=requestAnimationFrame(hLoop);const v=$('cam'),now=performance.now(),dt=Math.min(100,now-(H.t||now));H.t=now;
 if(H.lm&&v.videoWidth&&v.readyState>=2&&v.currentTime!==H.vt){H.vt=v.currentTime;try{hTake(H.lm.detectForVideo(v,now).landmarks,now)}catch(e){}}
 if(now-H.last>900)H.ptr=null;hStep(now,dt)}
async function hStart(){if(H.on||H.busy)return;H.busy=true;toast('<span>กำลังเปิดกล้อง รอสักครู่</span>');
 try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('no_camera');
  H.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480},frameRate:{ideal:60}},audio:false});
  const v=$('cam');v.muted=true;v.playsInline=true;v.srcObject=H.stream;v.hidden=false;try{await v.play()}catch(e){}
  if(!H.lm){const {HandLandmarker,FilesetResolver}=await import(MP_V),fs=await FilesetResolver.forVisionTasks(MP_V+'/wasm');
   const opt={baseOptions:{modelAssetPath:MP_MODEL,delegate:'GPU'},runningMode:'VIDEO',numHands:2,minHandDetectionConfidence:.55,minHandPresenceConfidence:.5,minTrackingConfidence:.4};
   try{H.lm=await HandLandmarker.createFromOptions(fs,opt)}catch(e){opt.baseOptions.delegate='CPU';H.lm=await HandLandmarker.createFromOptions(fs,opt)}}
  if(!H.want||!H.stream){hStop()}else{H.on=true;H.sig='';H.raf=requestAnimationFrame(hLoop);toast('<span>พลังมือพร้อม ยกมือชี้คำตอบค้างไว้</span>')}}
 catch(e){hStop();hSet(false);toast('<span>เปิดกล้องไม่ได้ ใช้แตะจอแทนนะ</span>')}
 H.busy=false}
function hStop(){H.on=false;cancelAnimationFrame(H.raf);try{H.stream&&H.stream.getTracks().forEach(t=>t.stop())}catch(e){}H.stream=null;const v=$('cam');try{v.pause()}catch(e){}v.srcObject=null;v.hidden=true;$('hcur').hidden=true;H.ptr=null;hClear()}
function hSync(id){id=id||(document.querySelector('.screen.on')||{}).id;if(H.want&&id!=='home'&&id!=='map')hStart();else hStop()}
function hSet(on){H.want=on;try{localStorage.setItem('fnf_hand',on?'1':'0')}catch(e){}drawHand();hSync()}
function drawHand(){$('hbtn').textContent='พลังมือ: '+(H.want?'เปิด':'ปิด')}
function openHand(){sheet('พลังมือวิเศษ',`<div class="note">เจ้าคุณมีพลังมือวิเศษ ยกมือขึ้นหน้ากล้อง มือจะกลายเป็นลูกแก้วทอง ชี้คำตอบค้างไว้จนแถบทองเต็ม คำตอบนั้นจะถูกเลือก</div>
 <h3>เปิดใช้พลังมือ</h3><div class="tg"><button data-hand="1" class="${H.want?'on':''}">เปิด</button><button data-hand="0" class="${H.want?'':'on'}">ปิด</button></div>
 <h3>ต้องชี้ค้างนานแค่ไหน</h3><div class="tabs">${['ไว','กลาง','ช้า'].map((t,i)=>`<button data-hsp="${i}" class="${H.speed===i?'on':''}">${t}</button>`).join('')}</div>
 <div class="note">กล้องเปิดเฉพาะตอนอยู่ในด่าน ภาพจากกล้องไม่ถูกบันทึกหรือส่งไปที่ไหน ใช้ได้กับปุ่มคำตอบและปุ่มไปต่อ ฉากสู้และด่านเขียนเลขยังใช้นิ้ว แตะจอได้ตลอดแม้เปิดพลังมือ</div>`)}
$('hbtn').onclick=()=>{sfx.tap();openHand()};drawHand();
/* เกมชุดเดิมของเจ้าคุณ (อยู่ที่ suratpoom.github.io ระดับบนสุด) เปิดเป็นหน้าแยก มีปุ่มกลับมาเกมนี้ในหน้ารวมของชุดนั้น */
const OTHER=[['/jaokun.html','7+3','คิดเลขจับมือ','โจทย์เด้งขึ้นมา โบกมือตอบผ่านกล้อง หรือแตะจอ'],['/jaokun-word.html','ABC','ซาฟารีคำศัพท์','ดูรูป จับศัพท์อังกฤษ'],
 ['/jaokun-memory.html','1 2 3','สวนสัตว์ความจำ','จำลำดับสัตว์ แล้วเลือกตาม'],['/jaokun-writer.html','ก A','นักเขียนตัวน้อย','ลากตามรอย ก-ฮ A-Z และ 0-9']];
$('more').onclick=()=>{sfx.tap();sheet('เกมอื่นของเจ้าคุณ',`<div class="og">${OTHER.map(g=>`<a href="${g[0]}"><span>${g[1]}</span><b>${g[2]}</b><small>${g[3]}</small></a>`).join('')}</div><div class="note">เกมชุดนี้เก็บคะแนนแยกจากเกมผจญภัย</div>`)};
/* ============ กดปุ่มให้ติดแม้นิ้วขยับ ============
   จอสัมผัส: เบราว์เซอร์จะไม่ส่ง click ถ้านิ้วเลื่อนไปนิดเดียวระหว่างแตะ เด็กเล็กแตะแล้วนิ้วไถลบ่อย ปุ่มเลยดูเหมือนกดไม่ติด
   แก้: จับจุดที่นิ้วลงและยก ถ้ายกภายในปุ่มเดิม (เผื่อขอบ 16px) และไถลไม่เกิน 30px ให้นับเป็นการกด แล้วกลืน click จริงที่ตามมาเพื่อไม่ให้กดซ้ำสองครั้ง
   เกิน 30px = ตั้งใจเลื่อนหน้าจอ ไม่นับ */
const TAPS=new Map();let ghostAt=0;
document.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;const b=e.target.closest&&e.target.closest('button,a');if(b)TAPS.set(e.pointerId,{b,x:e.clientX,y:e.clientY});},true);
document.addEventListener('pointercancel',e=>TAPS.delete(e.pointerId),true);
document.addEventListener('pointerup',e=>{const t=TAPS.get(e.pointerId);if(!t)return;TAPS.delete(e.pointerId);const b=t.b;if(b.disabled||!b.isConnected)return;
 const r=b.getBoundingClientRect(),m=16;
 if(Math.hypot(e.clientX-t.x,e.clientY-t.y)>30||e.clientX<r.left-m||e.clientX>r.right+m||e.clientY<r.top-m||e.clientY>r.bottom+m)return;
 ghostAt=Date.now();b.click()},true);
document.addEventListener('click',e=>{if(e.isTrusted&&Date.now()-ghostAt<600){e.stopPropagation();e.preventDefault()}},true);
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
cloudBoot();
if('serviceWorker'in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(S.auto)S.lv=autoLv();
</script>
